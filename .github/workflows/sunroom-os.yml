# Sunroom OS's image for each release (docs/SUNROOM-OS.md, docs/M7.md T18): pi-gen on GitHub's
# arm64 runner (no emulation), attached to the tag's Release with its checksum and Imager's
# repository file. About an hour; the deploy skill reports its link and doesn't wait for it.
name: Sunroom OS

on:
  push:
    tags: ["v*"]
  # The owner's one test, on a throwaway pre-release tag (for example v0.14.0-rc.1).
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build the image for
        required: true

permissions:
  contents: write

concurrency:
  group: sunroom-os-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make room (an image needs more than the runner's free 14 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build Sunroom Screen
        run: |
          (cd frontend && pnpm install --frozen-lockfile && pnpm exec vite build --config vite.screen.config.ts)
          (cd kiosk/agent && uv build --wheel --out-dir dist)
      - name: Build the image
        run: kiosk/os/build.sh "kiosk/agent/dist/sunroom_kiosk-$(cat VERSION)-py3-none-any.whl"
      - name: Imager's repository file
        run: |
          version=$(cat VERSION)
          python3 kiosk/os/imager.py "$version" "kiosk/os/deploy/sunroom-os-$version-pi-arm64.img.xz" \
            kiosk/os/deploy/imager.json
          cat kiosk/os/deploy/imager.json
      - name: Wait for the Release, or make a draft
        run: |
          tries=30 # the deploy skill's `just github-release` made it long ago, usually
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tries=1; fi
          for _ in $(seq "$tries"); do
            if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
            sleep 20
          done
          prerelease=""
          case $TAG in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --draft $prerelease --title "$TAG" \
            --notes "No Release was made for $TAG, so this draft holds its files. Add the CHANGELOG section and publish it (just github-release does both)."
      - name: Upload, Imager's file last
        run: |
          gh release upload "$TAG" --clobber kiosk/os/deploy/*.img.xz kiosk/os/deploy/*.img.xz.sha256
          gh release upload "$TAG" --clobber kiosk/os/deploy/imager.json
